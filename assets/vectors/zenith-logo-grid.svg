<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%">
  <defs>
    <style>
      .grid-line { stroke: #38BDF8; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
      .axis-line { stroke: #6366F1; stroke-width: 1.5; stroke-dasharray: 8 4; opacity: 0.7; }
      .circle-guide { stroke: #EC4899; stroke-width: 1.2; fill: none; opacity: 0.5; }
      .metric-text { font-family: monospace; font-size: 14px; fill: #38BDF8; font-weight: 600; }
      .dimension-arrow { stroke: #38BDF8; stroke-width: 1; fill: none; }
    </style>

    <linearGradient id="grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="500" fill="url(#grid-bg)" />

  <!-- Blueprint Background Grid Pattern -->
  <g opacity="0.15">
    <path d="M 0 50 H 1600 M 0 100 H 1600 M 0 150 H 1600 M 0 200 H 1600 M 0 250 H 1600 M 0 300 H 1600 M 0 350 H 1600 M 0 400 H 1600 M 0 450 H 1600" stroke="#94A3B8" stroke-width="1" />
    <path d="M 100 0 V 500 M 200 0 V 500 M 300 0 V 500 M 400 0 V 500 M 500 0 V 500 M 600 0 V 500 M 700 0 V 500 M 800 0 V 500 M 900 0 V 500 M 1000 0 V 500 M 1100 0 V 500 M 1200 0 V 500 M 1300 0 V 500 M 1400 0 V 500 M 1500 0 V 500" stroke="#94A3B8" stroke-width="1" />
  </g>

  <g transform="translate(40, 0)">
    <!-- Base Logo Geometry (Semi-transparent white) -->
    <g fill="#FFFFFF" opacity="0.35">
      <!-- Iconmark -->
      <path d="M 250 90 L 380 270 H 320 L 250 170 L 180 270 H 120 Z" />
      <path d="M 380 130 L 170 370 H 120 L 330 130 Z" />
      <path d="M 250 410 L 120 230 H 180 L 250 330 L 320 230 H 380 Z" />

      <!-- Typography -->
      <path d="M 480 160 H 610 V 188 L 516 292 H 610 V 320 H 480 V 292 L 574 188 H 480 Z" />
      <path d="M 640 160 H 750 V 188 H 668 V 226 H 735 V 254 H 668 V 292 H 750 V 320 H 640 Z" />
      <path d="M 780 160 H 808 L 882 284 V 160 H 910 V 320 H 882 L 808 196 V 320 H 780 Z" />
      <path d="M 940 160 H 968 V 320 H 940 Z" />
      <path d="M 998 160 H 1102 V 188 H 1064 V 320 H 1036 V 188 H 998 Z" />
      <path d="M 1132 160 H 1160 V 226 H 1220 V 160 H 1248 V 320 H 1220 V 254 H 1160 V 320 H 1132 Z" />
    </g>

    <!-- Blueprint Construction Overlay Lines -->
    <!-- Horizontal Baselines & Cap Heights -->
    <line x1="80" y1="90" x2="1300" y2="90" class="axis-line" />
    <line x1="80" y1="160" x2="1300" y2="160" class="axis-line" />
    <line x1="80" y1="250" x2="1300" y2="250" class="axis-line" />
    <line x1="80" y1="320" x2="1300" y2="320" class="axis-line" />
    <line x1="80" y1="410" x2="1300" y2="410" class="axis-line" />

    <!-- Icon Center Axis & Key Vertical Guides -->
    <line x1="250" y1="40" x2="250" y2="460" class="axis-line" />
    <line x1="120" y1="40" x2="120" y2="460" class="grid-line" />
    <line x1="380" y1="40" x2="380" y2="460" class="grid-line" />
    <line x1="480" y1="40" x2="480" y2="460" class="grid-line" />

    <!-- Golden Ratio Circle Guides -->
    <circle cx="250" cy="250" r="160" class="circle-guide" />
    <circle cx="250" cy="250" r="100" class="circle-guide" />
    <circle cx="250" cy="250" r="60" class="circle-guide" />

    <!-- Angular Construction Rays (45 deg & 60 deg) -->
    <line x1="90" y1="290" x2="410" y2="210" class="grid-line" />
    <line x1="90" y1="210" x2="410" y2="290" class="grid-line" />

    <!-- Blueprint Annotations & Dimension Labels -->
    <text x="260" y="80" class="metric-text">Apex Peak (y=90)</text>
    <text x="1320" y="165" class="metric-text">Cap-Height (160px)</text>
    <text x="1320" y="255" class="metric-text">X-Height Axis (250px)</text>
    <text x="1320" y="325" class="metric-text">Baseline (320px)</text>

    <!-- Golden Ratio Indicator Badge -->
    <rect x="120" y="440" width="180" height="30" rx="6" fill="#6366F1" opacity="0.3" />
    <text x="135" y="460" font-family="monospace" font-size="14" fill="#38BDF8" font-weight="700">ratio φ = 1.618</text>

    <!-- Angle Badge -->
    <rect x="340" y="440" width="120" height="30" rx="6" fill="#EC4899" opacity="0.3" />
    <text x="355" y="460" font-family="monospace" font-size="14" fill="#F472B6" font-weight="700">Angle: 54.7°</text>
  </g>
</svg>
