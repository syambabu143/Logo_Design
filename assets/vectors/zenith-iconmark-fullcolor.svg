<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="grad-top-apex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="grad-z-diagonal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="grad-base-anchor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Zenith Apex Crest Symbol -->
  <g filter="url(#mark-shadow)">
    <!-- Top Apex Chevron -->
    <path d="M 250 90 L 380 270 H 320 L 250 170 L 180 270 H 120 Z" fill="url(#grad-top-apex)" />

    <!-- Central Diagonal Z Blade -->
    <path d="M 380 130 L 170 370 H 120 L 330 130 Z" fill="url(#grad-z-diagonal)" />

    <!-- Bottom Anchor Chevron -->
    <path d="M 250 410 L 120 230 H 180 L 250 330 L 320 230 H 380 Z" fill="url(#grad-base-anchor)" />
  </g>
</svg>
